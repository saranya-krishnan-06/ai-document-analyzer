<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocMine — AI Document Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f0e0c;
    --ink2: #3a3830;
    --ink3: #7a776e;
    --paper: #faf8f4;
    --paper2: #f2efe8;
    --paper3: #e8e4d8;
    --accent: #c8502a;
    --accent2: #e8734a;
    --green: #2a6b4a;
    --green-bg: #eaf4ee;
    --red-bg: #fdeee9;
    --amber-bg: #fdf5e6;
    --border: rgba(15,14,12,0.1);
    --shadow: 0 2px 24px rgba(15,14,12,0.08);
    --API: 'http://3.16.10.106:8000';
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 2.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  .logo span { color: var(--accent); font-style: italic; }

  .header-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    background: var(--paper2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--ink3);
  }

  /* ── Layout ── */
  .app {
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: calc(100vh - 65px);
  }

  /* ── Sidebar ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    background: var(--paper);
  }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 0.75rem;
  }

  /* Upload zone */
  .upload-zone {
    border: 1.5px dashed var(--paper3);
    border-radius: 12px;
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--paper2);
    position: relative;
  }

  .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: #fdf5f2; }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  .upload-icon {
    width: 40px; height: 40px;
    margin: 0 auto 0.75rem;
    background: var(--paper3);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .upload-zone p { font-size: 13px; color: var(--ink3); }
  .upload-zone strong { color: var(--accent); font-weight: 500; }

  .file-types {
    display: flex; gap: 6px; justify-content: center; margin-top: 0.75rem; flex-wrap: wrap;
  }

  .file-type {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 2px 8px;
    background: var(--paper3);
    border-radius: 4px;
    color: var(--ink2);
  }

  /* Upload status */
  .upload-status {
    display: none;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 13px;
    align-items: center;
    gap: 8px;
  }

  .upload-status.loading { display: flex; background: var(--amber-bg); color: #92600a; }
  .upload-status.success { display: flex; background: var(--green-bg); color: var(--green); }
  .upload-status.error   { display: flex; background: var(--red-bg); color: var(--accent); }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Text input */
  .text-input-wrap textarea {
    width: 100%;
    min-height: 120px;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--paper2);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    color: var(--ink);
    resize: vertical;
    transition: border-color 0.15s;
  }

  .text-input-wrap textarea:focus { outline: none; border-color: var(--accent); }
  .char-count { font-size: 11px; color: var(--ink3); text-align: right; margin-top: 4px; font-family: 'DM Mono', monospace; }

  /* Action buttons */
  .actions { display: flex; flex-direction: column; gap: 8px; }

  .btn {
    display: flex; align-items: center; gap: 8px;
    padding: 0.65rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--paper2);
    color: var(--ink2);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
    text-align: left;
  }

  .btn:hover { background: var(--paper3); border-color: var(--ink3); }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent2); border-color: var(--accent2); }
  .btn.loading { opacity: 0.6; pointer-events: none; }

  .btn-icon { font-size: 15px; flex-shrink: 0; }

  /* ── Main panel ── */
  .main {
    padding: 2rem 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    overflow-y: auto;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }

  .tab {
    padding: 0.6rem 1.25rem;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'Outfit', sans-serif;
  }

  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Results */
  .result-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: var(--paper2);
  }

  .result-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink3);
  }

  .result-body { padding: 1.25rem; }

  /* Summary */
  .summary-text {
    font-family: 'DM Serif Display', serif;
    font-size: 1.15rem;
    line-height: 1.7;
    color: var(--ink);
  }

  /* Keywords */
  .keywords { display: flex; flex-wrap: wrap; gap: 8px; }

  .keyword {
    padding: 5px 14px;
    background: var(--paper2);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    color: var(--ink2);
    font-family: 'DM Mono', monospace;
    transition: all 0.15s;
  }

  .keyword:hover { background: var(--accent); color: white; border-color: var(--accent); cursor: default; }

  /* Sentiment */
  .sentiment-display {
    display: flex; align-items: center; gap: 1.5rem;
  }

  .sentiment-badge {
    font-size: 2rem;
    font-family: 'DM Serif Display', serif;
    font-weight: 400;
  }

  .sentiment-badge.POSITIVE { color: var(--green); }
  .sentiment-badge.NEGATIVE { color: var(--accent); }
  .sentiment-badge.NEUTRAL  { color: var(--ink3); }

  .sentiment-label {
    font-size: 13px; color: var(--ink3);
  }

  /* File analysis grid */
  .analysis-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .analysis-grid .result-card { animation-delay: calc(var(--i) * 0.05s); }

  /* Chat */
  .chat-wrap {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 220px);
    min-height: 400px;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .chat-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--ink3);
    gap: 0.5rem;
    font-size: 14px;
  }

  .chat-empty-icon { font-size: 2.5rem; }

  .msg {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.2s ease;
    max-width: 85%;
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .msg.user .msg-avatar { background: var(--accent); color: white; }
  .msg.bot .msg-avatar  { background: var(--paper3); color: var(--ink2); }

  .msg-bubble {
    padding: 0.65rem 1rem;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
  }

  .msg.user .msg-bubble { background: var(--accent); color: white; border-radius: 12px 2px 12px 12px; }
  .msg.bot  .msg-bubble { background: white; border: 1px solid var(--border); border-radius: 2px 12px 12px 12px; color: var(--ink); }

  .chat-input-row {
    display: flex;
    gap: 8px;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  .chat-input-row input {
    flex: 1;
    padding: 0.7rem 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--paper2);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    color: var(--ink);
    transition: border-color 0.15s;
  }

  .chat-input-row input:focus { outline: none; border-color: var(--accent); }

  .chat-send {
    padding: 0.7rem 1.25rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }

  .chat-send:hover { background: var(--accent2); }
  .chat-send:disabled { opacity: 0.5; pointer-events: none; }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    text-align: center;
    color: var(--ink3);
    gap: 0.75rem;
  }

  .empty-icon {
    font-size: 3rem;
    margin-bottom: 0.5rem;
  }

  .empty-state h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    color: var(--ink2);
    font-weight: 400;
  }

  .empty-state p { font-size: 13px; max-width: 300px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--paper3); border-radius: 3px; }

  /* Responsive */
  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    header { padding: 1rem 1.25rem; }
    .main { padding: 1.25rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Doc<span>Mine</span></div>
  <div class="header-badge">AI Document Analyzer</div>
</header>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <div>
      <div class="section-label">Upload document</div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt">
        <div class="upload-icon">📄</div>
        <p><strong>Click to upload</strong> or drag & drop</p>
        <div class="file-types">
          <span class="file-type">PDF</span>
          <span class="file-type">DOCX</span>
          <span class="file-type">TXT</span>
        </div>
      </div>
      <div class="upload-status" id="uploadStatus"></div>
    </div>

    <div class="text-input-wrap">
      <div class="section-label">Or paste text</div>
      <textarea id="textInput" placeholder="Paste any text here to analyze…" oninput="updateCharCount()"></textarea>
      <div class="char-count"><span id="charCount">0</span> / 5000</div>
    </div>

    <div>
      <div class="section-label">Actions</div>
      <div class="actions">
        <button class="btn primary" id="btnAnalyzeFile" onclick="analyzeFile()" style="display:none">
          <span class="btn-icon">⚡</span> Analyze File
        </button>
        <button class="btn" onclick="runSummarize()">
          <span class="btn-icon">📝</span> Summarize text
        </button>
        <button class="btn" onclick="runKeywords()">
          <span class="btn-icon">🏷</span> Extract keywords
        </button>
        <button class="btn" onclick="runSentiment()">
          <span class="btn-icon">💬</span> Analyze sentiment
        </button>
      </div>
    </div>

  </aside>

  <!-- ── Main ── -->
  <main class="main">

    <div class="tabs">
      <button class="tab active" onclick="switchTab('results', this)">Results</button>
      <button class="tab" onclick="switchTab('chat', this)">Chat with document</button>
    </div>

    <!-- Results tab -->
    <div class="tab-panel active" id="tab-results">
      <div id="resultsArea">
        <div class="empty-state">
          <div class="empty-icon">🔬</div>
          <h3>Nothing analyzed yet</h3>
          <p>Upload a document or paste text, then use the actions on the left.</p>
        </div>
      </div>
    </div>

    <!-- Chat tab -->
    <div class="tab-panel" id="tab-chat">
      <div class="chat-wrap">
        <div class="chat-messages" id="chatMessages">
          <div class="chat-empty">
            <div class="chat-empty-icon">💬</div>
            <p>Upload a document first, then ask questions about it.</p>
          </div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Ask a question about your document…" onkeydown="if(event.key==='Enter') sendChat()">
          <button class="chat-send" id="chatSend" onclick="sendChat()">Send</button>
        </div>
      </div>
    </div>

  </main>
</div>

<script>
  const API = 'https://dwlf85sg0bufi.cloudfront.net';
  let documentLoaded = false;

  // ── Char counter ──
  function updateCharCount() {
    const v = document.getElementById('textInput').value.length;
    document.getElementById('charCount').textContent = v;
  }

  // ── Tab switching ──
  function switchTab(name, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
  }

  // ── Drag & drop ──
  const zone = document.getElementById('uploadZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f) { document.getElementById('fileInput').files = e.dataTransfer.files; onFileSelected(f); }
  });
  document.getElementById('fileInput').addEventListener('change', e => {
    if (e.target.files[0]) onFileSelected(e.target.files[0]);
  });

  function onFileSelected(file) {
    zone.querySelector('p').innerHTML = `<strong>${file.name}</strong>`;
    document.getElementById('btnAnalyzeFile').style.display = 'flex';
    setUploadStatus('', '');
  }

  // ── Upload status helper ──
  function setUploadStatus(type, msg) {
    const el = document.getElementById('uploadStatus');
    el.className = 'upload-status' + (type ? ' ' + type : '');
    el.innerHTML = type === 'loading'
      ? `<div class="spinner"></div>${msg}`
      : msg;
  }

  // ── Get text source ──
  function getText() {
    return document.getElementById('textInput').value.trim();
  }

  // ── Render helpers ──
  function showResult(html) {
    document.getElementById('resultsArea').innerHTML = html;
  }

  function resultCard(title, bodyHtml, index = 0) {
    return `
      <div class="result-card" style="--i:${index}">
        <div class="result-header">
          <span class="result-title">${title}</span>
        </div>
        <div class="result-body">${bodyHtml}</div>
      </div>`;
  }

  function setLoading(btnId) {
    const b = document.getElementById(btnId);
    if (b) b.classList.add('loading');
  }

  function clearLoading(btnId) {
    const b = document.getElementById(btnId);
    if (b) b.classList.remove('loading');
  }

  // ── Analyze uploaded file ──
  async function analyzeFile() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) return;

    setUploadStatus('loading', 'Analyzing document…');
    document.getElementById('btnAnalyzeFile').classList.add('loading');

    try {
      const formData = new FormData();
      formData.append('file', file);

      const res = await fetch(`${API}/analyze/file`, { method: 'POST', body: formData });
      const data = await res.json();

      if (data.detail) throw new Error(data.detail);

      documentLoaded = true;
      setUploadStatus('success', `✓ ${file.name} analyzed — ${data.chunks_indexed} chunks indexed`);

      const sentimentColor = data.sentiment.label === 'POSITIVE' ? 'var(--green)' :
                              data.sentiment.label === 'NEGATIVE' ? 'var(--accent)' : 'var(--ink3)';

      showResult(`
        <div style="display:flex;flex-direction:column;gap:1rem">
          ${resultCard('Summary', `<p class="summary-text">${data.summary}</p>`, 0)}
          <div class="analysis-grid">
            ${resultCard('Keywords', `<div class="keywords">${data.keywords.map(k => `<span class="keyword">${k}</span>`).join('')}</div>`, 1)}
            ${resultCard('Sentiment', `
              <div class="sentiment-display">
                <div class="sentiment-badge ${data.sentiment.label}">${data.sentiment.label}</div>
                <div class="sentiment-label">Detected from document content</div>
              </div>`, 2)}
          </div>
        </div>`);

      switchTab('results', document.querySelector('.tab.active') || document.querySelectorAll('.tab')[0]);
      document.querySelectorAll('.tab')[0].click();

    } catch (e) {
      setUploadStatus('error', '✗ ' + (e.message || 'Failed to analyze file'));
    } finally {
      document.getElementById('btnAnalyzeFile').classList.remove('loading');
    }
  }

  // ── Summarize text ──
  async function runSummarize() {
    const text = getText();
    if (!text) { alert('Please paste some text first.'); return; }

    showResult(`<div class="empty-state"><div class="spinner" style="width:24px;height:24px;border-width:3px;color:var(--accent)"></div><p style="margin-top:1rem">Summarizing…</p></div>`);

    try {
      const res = await fetch(`${API}/analyze/summarize`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const data = await res.json();
      if (data.detail) throw new Error(data.detail);
      showResult(resultCard('Summary', `<p class="summary-text">${data.summary}</p>`));
    } catch (e) {
      showResult(`<div class="empty-state"><p style="color:var(--accent)">Error: ${e.message}</p></div>`);
    }
  }

  // ── Keywords ──
  async function runKeywords() {
    const text = getText();
    if (!text) { alert('Please paste some text first.'); return; }

    showResult(`<div class="empty-state"><div class="spinner" style="width:24px;height:24px;border-width:3px;color:var(--accent)"></div><p style="margin-top:1rem">Extracting keywords…</p></div>`);

    try {
      const res = await fetch(`${API}/analyze/keywords`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const data = await res.json();
      if (data.detail) throw new Error(data.detail);
      const kw = data.keywords.map(k => `<span class="keyword">${k}</span>`).join('');
      showResult(resultCard('Keywords', `<div class="keywords">${kw}</div>`));
    } catch (e) {
      showResult(`<div class="empty-state"><p style="color:var(--accent)">Error: ${e.message}</p></div>`);
    }
  }

  // ── Sentiment ──
  async function runSentiment() {
    const text = getText();
    if (!text) { alert('Please paste some text first.'); return; }

    showResult(`<div class="empty-state"><div class="spinner" style="width:24px;height:24px;border-width:3px;color:var(--accent)"></div><p style="margin-top:1rem">Analyzing sentiment…</p></div>`);

    try {
      const res = await fetch(`${API}/analyze/sentiment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const data = await res.json();
      if (data.detail) throw new Error(data.detail);
      const s = data.sentiment;
      showResult(resultCard('Sentiment', `
        <div class="sentiment-display">
          <div class="sentiment-badge ${s.label}">${s.label}</div>
          <div class="sentiment-label">Confidence score: ${(s.score * 100).toFixed(0)}%</div>
        </div>`));
    } catch (e) {
      showResult(`<div class="empty-state"><p style="color:var(--accent)">Error: ${e.message}</p></div>`);
    }
  }

  // ── Chat ──
  async function sendChat() {
    const input = document.getElementById('chatInput');
    const question = input.value.trim();
    if (!question) return;

    const messages = document.getElementById('chatMessages');

    // Clear empty state
    const empty = messages.querySelector('.chat-empty');
    if (empty) empty.remove();

    // User message
    messages.innerHTML += `
      <div class="msg user">
        <div class="msg-avatar">U</div>
        <div class="msg-bubble">${question}</div>
      </div>`;

    input.value = '';
    document.getElementById('chatSend').disabled = true;

    // Thinking indicator
    const thinkId = 'think-' + Date.now();
    messages.innerHTML += `
      <div class="msg bot" id="${thinkId}">
        <div class="msg-avatar">AI</div>
        <div class="msg-bubble" style="color:var(--ink3)">
          <div class="spinner" style="width:14px;height:14px;border-width:2px;color:var(--ink3);display:inline-block"></div>
          Thinking…
        </div>
      </div>`;
    messages.scrollTop = messages.scrollHeight;

    try {
      const res = await fetch(`${API}/ai/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await res.json();

      document.getElementById(thinkId).remove();
      messages.innerHTML += `
        <div class="msg bot">
          <div class="msg-avatar">AI</div>
          <div class="msg-bubble">${data.answer}</div>
        </div>`;
    } catch (e) {
      document.getElementById(thinkId).remove();
      messages.innerHTML += `
        <div class="msg bot">
          <div class="msg-avatar">AI</div>
          <div class="msg-bubble" style="color:var(--accent)">Error: ${e.message}</div>
        </div>`;
    } finally {
      document.getElementById('chatSend').disabled = false;
      messages.scrollTop = messages.scrollHeight;
    }
  }
</script>
</body>
</html>
