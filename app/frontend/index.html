<!DOCTYPE html>
<html>
<head>
    <title>AI Document Chat</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .chat-box {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
        }

        .user {
            text-align: right;
            margin: 10px;
            color: blue;
        }

        .bot {
            text-align: left;
            margin: 10px;
            color: green;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

    </style>
</head>
<body>

<div class="container">
    <h2>📄 AI Document Chat</h2>

    <!-- Upload -->
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>

    <p id="uploadStatus"></p>

    <!-- Chat -->
    <div class="chat-box" id="chatBox"></div>

    <input type="text" id="question" placeholder="Ask something...">
    <button onclick="sendQuestion()">Send</button>
</div>

<script>

async function uploadFile() {
    const fileInput = document.getElementById("fileInput");
    const status = document.getElementById("uploadStatus");

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    const response = await fetch("http://127.0.0.1:8000/document/upload", {
        method: "POST",
        body: formData
    });

    const data = await response.json();

    status.innerText = "✅ " + data.message;
}

async function sendQuestion() {
    const input = document.getElementById("question");
    const chatBox = document.getElementById("chatBox");

    const question = input.value;

    // Show user message
    chatBox.innerHTML += `<div class="user">👤 ${question}</div>`;

    const response = await fetch("http://127.0.0.1:8000/document/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ question })
    });

    const data = await response.json();

    // Show bot response
    chatBox.innerHTML += `<div class="bot">🤖 ${data.answer}</div>`;

    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;
}

</script>

</body>
</html>
